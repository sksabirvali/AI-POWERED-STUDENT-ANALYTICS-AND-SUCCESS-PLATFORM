services:
  - type: web
    name: student-success-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-success-db
          property: connectionString
      - key: APP_AUTH_SECRET
        generateValue: true
      - key: APP_SEED_DEMO
        value: "true"
      - key: APP_FRONTEND_DIST
        value: /app/frontend/dist
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_FACULTY_PASSWORD
        sync: false
      - key: DEMO_STUDENT_PASSWORD
        sync: false

databases:
  - name: student-success-db
    plan: free
    databaseName: student_success
    user: student_success_user
